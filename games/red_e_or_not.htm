<!doctype HTML>
<html lang="en">
    <head>
        <title>Red E or Not!</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #222;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: sans-serif;
            }
            canvas {
                background-color: #000;
                max-width: 100%;
                max-height: 100vh;
                box-shadow: 0 0 20px rgba(0,0,0,0.8);
                cursor: none;
            }
            #parent-dashboard {
                display: none;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                z-index: 10;
            }
            #success-modal {
                display: none;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #FFF8DC; 
                padding: 30px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8);
                text-align: center;
                z-index: 20;
                border: 4px solid #87CEEB;
            }
            #success-modal h2 {
                margin-top: 0;
                color: #333;
                font-size: 32px;
            }
            #mini-canvas {
                background: white;
                border-radius: 8px; /* Changed to a rounded square */
                border: 4px solid #ddd;
                margin-bottom: 20px;
                width: 150px;
                height: 150px;
            }
            #next-level-btn {
                background: #7CFC00;
                color: #222;
                border: none;
                padding: 15px 30px;
                font-size: 24px;
                font-weight: bold;
                border-radius: 8px;
                cursor: pointer;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            }
            #next-level-btn:hover {
                background: #6BE000;
            }
        </style>
    </head>
    <body>
        <div id="parent-dashboard">
            <h2>Parent Dashboard</h2>
            <p>Settings will go here.</p>
            <button id="close-dashboard">Close</button>
        </div>
        <div id="success-modal">
            <h2>You found it!</h2>
            <canvas id="mini-canvas" width="200" height="200"></canvas>
            <br>
            <button id="next-level-btn">Next Level ➔</button>
        </div>

        <script src="../scripts/html_tools.js"></script>
        <script>
            const GAME_WIDTH = 1024;
            const GAME_HEIGHT = 768;

            let glassRadius = 50; // Will be dynamically calculated per level
            let targetEntity = null; // A direct reference to our Red E so we don't have to search for it

            const DEFAULT_SETTINGS = {
                gridRows: 3, gridCols: 3,
                clutterDensity: 0.2,
                cellOffsetVariance: 0.1,
                letterScaleVariance: 0.0,
                targetCase: 'upper',
                targetFontComplexity: 0.0,
                includeLowercaseDistractors: 0.0,
                distractorFontComplexity: 0.0,
                distractorSimilarity: 0.0,
                allowSplitBackground: false,
                bgSplitRatio: 0.5,
                allowScenery: false,
                sceneryDensity: 0.0,
                bonusTargetPoolSize: 0,
            };

            const MILESTONES = [
                { level: 1, gridRows: 3, gridCols: 3, clutterDensity: 0.2 },
                { level: 10, gridRows: 6, gridCols: 6, includeLowercaseDistractors: 0.5, allowScenery: true },
                { level: 15, allowSplitBackground: true },
                { level: 25, gridRows: 12, gridCols: 12, targetCase: 'random', includeLowercaseDistractors: 1.0 },
                { level: 26, gridRows: 18, gridCols: 20, clutterDensity: 1.0, cellOffsetVariance: 1.0, letterScaleVariance: 1.5, distractorSimilarity: 0.9, allowScenery: true, sceneryDensity: 0.5 },
            ];

            function getLevelSettings(level) {
                const settings = { 'level': level };

                for (const key in DEFAULT_SETTINGS) {
                    const val = DEFAULT_SETTINGS[key];
                    
                    if (typeof val === 'number') {
                        // Check if it's meant to be an integer (like grid rows) or float
                        // For now, let's treat all numbers as interpolatable if they have milestones
                        settings[key] = getInterpolatedValue(level, key);
                    } else {
                        settings[key] = getLatestValue(level, key);
                    }
                }
                
                return settings;
            }

            function getLatestValue(level, attribute) {
                let value = DEFAULT_SETTINGS[attribute];
                for (const m of MILESTONES) {
                    if (m.level <= level && m.hasOwnProperty(attribute)) {
                        value = m[attribute];
                    }
                }
                return value;
            }

            function getInterpolatedValue(level, attribute) {
                let startMilestone = null;
                let endMilestone = null;

                // 1. Find the bounding keyframes
                for (const m of MILESTONES) {
                    if (m.hasOwnProperty(attribute)) {
                        if (m.level <= level) {
                            // Keeps overwriting until we have the LAST milestone <= current level
                            startMilestone = m; 
                        } else if (m.level > level) {
                            // Grabs the FIRST milestone > current level, then stops searching
                            endMilestone = m; 
                            break; 
                        }
                    }
                }

                // 2. Handle missing bounds
                // If no prior milestone defined this attribute, assume it starts at Level 1 with the default
                if (!startMilestone) {
                    startMilestone = { level: 1, [attribute]: DEFAULT_SETTINGS[attribute] };
                }

                // If there is no future milestone, we've maxed out the progression for this trait
                if (!endMilestone) {
                    return startMilestone[attribute];
                }

                // 3. Perform the interpolation (Lerp)
                const range = endMilestone.level - startMilestone.level;
                const t = (level - startMilestone.level) / range; 
                
                const startVal = startMilestone[attribute];
                const endVal = endMilestone[attribute];

                return startVal + (endVal - startVal) * t;
            }

            function GameEngine(width, height) {
                const w = width;
                const h = height;

                let gameState = 'playing'; // 'playing' or 'success'
                let shakeTimer = 0;
                const SHAKE_DURATION = 300; // ms

                // Mouse State
                let mx = 0;
                let my = 0;
                let drawGlass = false;

                // Instantiate the grid once
                const grid = new Grid(w, h);

                // The DOM elements for our success modal
                const successModal = document.getElementById('success-modal');
                const nextLevelBtn = document.getElementById('next-level-btn');
                const miniCanvas = document.getElementById('mini-canvas');
                const miniCtx = miniCanvas.getContext('2d');

                // Hook up the Next Level button
                nextLevelBtn.addEventListener('click', () => {
                    successModal.style.display = 'none';
                    gameState = 'playing';
                    this.loadLevel(this.currentLevelConfig.level + 1);
                });

                // Dynamic Level Configuration (Foundation laid for future computation)
                this.currentLevelConfig = {};

                // A new method to handle loading a level
                this.loadLevel = (levelNumber) => {
                    this.currentLevelConfig = getLevelSettings(levelNumber);
                    
                    // Tell the grid to map out the new level's dimensions
                    grid.build(this.currentLevelConfig);
                    
                    // Grab the Red E reference directly from the grid to make hit detection $O(1)$
                    targetEntity = grid.getTargetEntity(); 
                    
                    // Calculate 2/3rds of the target's max dimension
                    // (Assuming targetEntity exposes its fontSize or max dimensions)
                    glassRadius = targetEntity.fontSize * 0.66;
                    
                    console.log(`Level ${levelNumber} loaded!`, this.currentLevelConfig);
                };

                this.mouseEvent = (mouseX, mouseY, eventType) => {
                    mx = mouseX;
                    my = mouseY;

                    if (eventType === 'mouseup' && gameState === 'playing' && targetEntity) {
                        const dx = mx - targetEntity.x;
                        const dy = my - targetEntity.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < glassRadius * 0.8) {
                            // HIT! We pass the global ctx so we can force a redraw
                            this.triggerSuccess(ctx); 
                        } else {
                            // MISS! Start the wobble timer
                            shakeTimer = SHAKE_DURATION;
                        }
                    }
                    else if (eventType == 'mousemove' || eventType === 'mouseover') {
                        drawGlass = true;
                    }
                    else if (eventType === 'mouseout') {
                        drawGlass = false;
                    }
                };

                this.triggerSuccess = (mainCtx) => {
                    gameState = 'success';
                    
                    // 1. Force a clean draw (This redraws the board without the magnifying glass)
                    this.draw(mainCtx); 
                    
                    // 2. Calculate the 2x square cutout
                    // We use fontSize as the longest dimension proxy for the text
                    const snapSize = targetEntity.fontSize * 2;
                    const sx = targetEntity.x - (snapSize / 2);
                    const sy = targetEntity.y - (snapSize / 2);
                    
                    // 3. Clear the mini-canvas and draw the cutout from the main canvas
                    miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
                    
                    // drawImage(source, sourceX, sourceY, sourceW, sourceH, destX, destY, destW, destH)
                    miniCtx.drawImage(
                        mainCtx.canvas, 
                        sx, sy, snapSize, snapSize, 
                        0, 0, miniCanvas.width, miniCanvas.height
                    );
                    
                    // 4. Show the modal
                    successModal.style.display = 'block';
                };

                this.update = (dt) => {
                    if (shakeTimer > 0) {
                        shakeTimer -= dt;
                    }
                    grid.update(dt);
                };

                // --- Modular Drawing Functions ---

                const drawBackground = (ctx) => {
                    const config = this.currentLevelConfig;
                    if (!config) return;

                    if (!config.allowSplitBackground) {
                        ctx.fillStyle = '#222'; // Default solid for now
                        ctx.fillRect(0, 0, w, h);
                    } else {
                        const splitY = h * config.bgSplitRatio;
                        ctx.fillStyle = '#87CEEB'; // Sky
                        ctx.fillRect(0, 0, w, splitY);
                        ctx.fillStyle = '#7CFC00'; // Ground
                        ctx.fillRect(0, splitY, w, h - splitY);
                    }
                };

                // --- Main Draw Loop ---

                this.draw = (ctx) => {
                    // Clear Canvas
                    ctx.clearRect(0, 0, w, h);

                    ctx.save();

                    // Apply the wobble if we missed
                    if (shakeTimer > 0) {
                        const intensity = 8; // Pixels to move left/right
                        const speed = 0.04; 
                        const offsetX = Math.sin(shakeTimer * speed) * intensity;
                        ctx.translate(offsetX, 0);
                    }

                    drawBackground(ctx);

                    // The engine delegates spatial drawing to the grid
                    grid.draw(ctx);
    
                    // Draw the Magnifying Glass ONLY if we are actively playing
                    if (drawGlass && gameState === 'playing') {
                        ctx.beginPath();
                        ctx.arc(mx, my, glassRadius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.fill();
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#555';
                        ctx.stroke();

                        ctx.beginPath();
                        const handleStartX = mx + (glassRadius * Math.cos(Math.PI / 4));
                        const handleStartY = my + (glassRadius * Math.sin(Math.PI / 4));
                        ctx.moveTo(handleStartX, handleStartY);
                        ctx.lineTo(handleStartX + (glassRadius * 0.8), handleStartY + (glassRadius * 0.8));
                        ctx.lineWidth = 12;
                        ctx.lineCap = 'round';
                        ctx.strokeStyle = '#8B4513';
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                };
            }

            function Grid(gameWidth, gameHeight) {
                // Lock the stage dimensions into the closure
                const w = gameWidth;
                const h = gameHeight;

                let targetRef = null;
                this.getTargetEntity = () => targetRef;
                
                // Internal state
                let cells = [];
                let rows = 0;
                let cols = 0;

                // The reset/rebuild method to be called on level load
                this.build = (levelSettings) => {
                    cells = []; // Clear the old layout
                    
                    // Consume and round the decimal settings into integers
                    rows = Math.round(levelSettings.gridRows);
                    cols = Math.round(levelSettings.gridCols);
                    
                    const cellWidth = w / cols;
                    const cellHeight = h / rows;
                    
                    // 1. Generate the empty spatial map
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            cells.push({
                                row: r,
                                col: c,
                                x: c * cellWidth,
                                y: r * cellHeight,
                                width: cellWidth,
                                height: cellHeight,
                                // Pre-calculating the center saves math later during drawing
                                centerX: (c * cellWidth) + (cellWidth / 2),
                                centerY: (r * cellHeight) + (cellHeight / 2),
                                entity: null // This will hold our letter/word object later
                            });
                        }
                    }

                    // 2. Insert the Target "Red E"
                    let targetChar = 'E';
                    if (levelSettings.targetCase === 'lower') {
                        targetChar = 'e';
                    } else if (levelSettings.targetCase === 'random') {
                        targetChar = Math.random() < 0.5 ? 'E' : 'e';
                    }

                    // Pick a random cell for the target
                    const targetX = Math.floor(Math.random() * (cols - 2)) + 1;
                    const targetY = Math.floor(Math.random() * (rows - 2)) + 1;
                    const targetIndex = targetY * cols + targetX;
                    const targetEntity = new CharacterDisplay(targetChar, cells[targetIndex], levelSettings, true);
                    cells[targetIndex].entity = targetEntity;
                    targetRef = targetEntity; // Save it for the engine!

                    // 3. Populate Clutter (Distractors)
                    const distractorChars = "ABCDFGHIJKLMNOPQRSTUVWXYZ"; // Excludes 'E'
                    const lowerCaseOdds = levelSettings.includeLowercaseDistractors / 2;

                    for (let i = 0; i < cells.length; i++) {
                        // Skip the cell if it already contains our Target
                        if (i === targetIndex) continue;

                        // Roll against the clutter density scalar (0.0 to 1.0)
                        if (Math.random() <= levelSettings.clutterDensity) {
                            
                            // Pick a random distractor character
                            const randomIndex = Math.floor(Math.random() * distractorChars.length);
                            let char = distractorChars.charAt(randomIndex);
                            
                            // Roll to see if it becomes lowercase
                            if (Math.random() < lowerCaseOdds) {
                                char = char.toLowerCase();
                            }

                            // Instantiate and assign to the cell
                            cells[i].entity = new CharacterDisplay(char, cells[i], levelSettings, false);
                        }
                    }
                };

                this.update = (dt) => {
                    // Future: Iterate through cells and call entity.update(dt) if needed
                };

                this.draw = (ctx) => {
                    // Debug Rendering: Let's draw the grid lines so we can see it working
                    ctx.save();
                    
                    for (let i = 0; i < cells.length; i++) {
                        const cell = cells[i];
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; // Faint white lines
                        ctx.lineWidth = 2;
                        ctx.strokeRect(cell.x, cell.y, cell.width, cell.height);
                        
                        if (cell.entity) {
                            cell.entity.draw(ctx);
                        }
                    }
                    ctx.restore();
                };
            }

            function CharacterDisplay(text, cell, settings, isTarget = false) {
                this.text = text;
                this.isTarget = isTarget;

                // Size & Position Math
                const baseSize = Math.min(cell.width, cell.height) * 0.7;
                const scaleRandomness = ((Math.random() * 2) - .5) * settings.letterScaleVariance;
                this.fontSize = Math.max(8, baseSize + (baseSize * scaleRandomness));

                const maxOffsetX = (cell.width / 2) * settings.cellOffsetVariance;
                const maxOffsetY = (cell.height / 2) * settings.cellOffsetVariance;
                this.x = cell.centerX + ((Math.random() * 2 - 1) * maxOffsetX);
                this.y = cell.centerY + ((Math.random() * 2 - 1) * maxOffsetY);

                // Styling
                this.colors = this.generateColors(settings.distractorSimilarity);
                this.fontFamily = this.generateFont(settings.distractorFontComplexity);

                this.draw = (ctx) => {
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `bold ${this.fontSize}px ${this.fontFamily}`;

                    // Draw the Outline (Stroke) first so it sits behind the fill
                    ctx.lineWidth = this.fontSize * 0.15; // Scale outline thickness with the letter size
                    ctx.strokeStyle = this.colors.stroke;
                    ctx.lineJoin = 'round'; // Gives the outline soft, friendly corners
                    ctx.strokeText(this.text, this.x, this.y);

                    // Draw the Fill
                    ctx.fillStyle = this.colors.fill;
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.restore();
                };
            }

            // --- Generator Methods ---

            CharacterDisplay.prototype.generateColors = function(similarity) {
                // 1. The Target is an immutable guarantee
                if (this.isTarget) {
                    return { fill: '#FF0000', stroke: '#FFFFFF' }; 
                }

                // 2. High Similarity (The Tricky Distractors)
                // If similarity is high, there's a chance to use "trick" color combos
                if (similarity > 0.7 && Math.random() < similarity) {
                    const trickyFills = ['#FF0000', '#FFFFFF', '#FF4500']; // Red, White, Orange-Red
                    const trickyStrokes = ['#000000', '#FFFF00', '#FF0000']; // Black, Yellow, Red
                    
                    let f = trickyFills[Math.floor(Math.random() * trickyFills.length)];
                    let s = trickyStrokes[Math.floor(Math.random() * trickyStrokes.length)];
                    
                    // CRITICAL GUARDRAIL: Never accidentally generate the exact Target combo
                    if (f === '#FF0000' && s === '#FFFFFF') {
                        s = '#000000'; // Swap the white outline for black
                    }
                    return { fill: f, stroke: s };
                }

                // 3. Normal / Low Similarity Distractors
                // Avoid pure red. Stick to blues, greens, yellows, and purples.
                const safeHues = [240, 120, 60, 300, 30, 180]; 
                const hue = safeHues[Math.floor(Math.random() * safeHues.length)];
                
                return {
                    fill: `hsl(${hue}, 80%, 50%)`,
                    stroke: (Math.random() > 0.5) ? '#FFFFFF' : '#000000' // 50/50 white or black outline
                };
            };

            CharacterDisplay.prototype.generateFont = function(complexity) {
                // TODO: let's really research our font selections.
                // This isn't working (there are fonts with serifs in the "easy" category).
                // EASY: Single-story characters, high legibility.
                // (Comic Sans and Century Gothic are the primary web-safe options here)
                const easyFonts = [
                    '"Comic Sans MS"', 
                    '"Century Gothic"', 
                    'Quicksand', // Google Font (Great for kids)
                    'Andika'     // Google Font (Specifically designed for literacy)
                ];
                
                // MEDIUM: Clean sans-serif, but introduces double-story 'a' and 'g'.
                const mediumFonts = [
                    'Arial', 
                    'Verdana', 
                    'Helvetica', 
                    '"Trebuchet MS"'
                ];
                
                // HARD: Introduces serifs, varied stroke widths, and complex shapes.
                const hardFonts = [
                    'Georgia', 
                    '"Times New Roman"', 
                    '"Courier New"', 
                    'Impact', 
                    '"Brush Script MT"'
                ];

                let pool = [...easyFonts];
                
                // As complexity scales from 0.0 to 1.0, we expand the pool
                if (complexity > 0.33) pool = pool.concat(mediumFonts);
                if (complexity > 0.66) pool = pool.concat(hardFonts);

                return pool[Math.floor(Math.random() * pool.length)];
            };

            // --- Initialization ---
            const canvas = createElement('canvas', {'width': GAME_WIDTH, 'height': GAME_HEIGHT}, null);
            const ctx = canvas.getContext('2d');
            document.body.appendChild(canvas);

            const game = new GameEngine(GAME_WIDTH, GAME_HEIGHT);
            game.loadLevel(1); // Load level 1 to kick things off

            // --- Input Handling ---
            function handleMouseEvent(evt) {
                evt.preventDefault();
                const rect = canvas.getBoundingClientRect();
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const scaledX = (evt.clientX - rect.left) * scaleX;
                const scaledY = (evt.clientY - rect.top) * scaleY;

                game.mouseEvent(scaledX, scaledY, evt.type);
            }

            // Removed mousedown; only tracking move and up
            canvas.addEventListener('mousemove', handleMouseEvent, false);
            canvas.addEventListener('mouseup', handleMouseEvent, false);
            canvas.addEventListener('mousedown', (evt) => evt.preventDefault(), false);
            canvas.addEventListener('mouseover', handleMouseEvent, false);
            canvas.addEventListener('mouseout', handleMouseEvent, false);

            // Parent Dashboard Toggle
            const dashboard = document.getElementById('parent-dashboard');
            document.addEventListener('keydown', (evt) => {
                if (evt.shiftKey && (evt.key === 'P' || evt.key === 'p')) {
                    dashboard.style.display = dashboard.style.display === 'block' ? 'none' : 'block';
                }
            });
            document.getElementById('close-dashboard').addEventListener('click', () => {
                dashboard.style.display = 'none';
            });

            // --- Core Loop ---
            let lastUpdate = Date.now();
            function animateGame() {
                const nowUpdate = Date.now();
                const dt = nowUpdate - lastUpdate;
                lastUpdate = nowUpdate;
                
                game.update(dt);
                game.draw(ctx);
                
                requestAnimationFrame(animateGame);
            }

            animateGame();
        </script>
    </body>
</html>
