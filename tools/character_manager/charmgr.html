<!DOCTYPE html>
<html color-mode="user">
    <head>
        <title>Character Manager</title>
        <!-- TODO: convert to pico? Would need to refactor the HTML structure, unfortunately. -->
        <link rel="stylesheet" href="../../css/mvp.css">
    </head>
    <body>
        <script src="../../scripts/html_tools.js"></script>
        <script src="../../scripts/file_manager.js"></script>
        <div id="main">
            <main>
                <!-- TODO: make this something that can be pulled up again from the menu? -->
                <input type="file" name="inputText" id="inputText" accept=".json" />
                <input type="button" value="Init From File" onclick="javascript:app.loadFromFile('inputText');" />
                <input type="button" value="Init Without File" onclick="javascript:app.loadFromLocalStorage();" />
            </main>
        </div>
        <script>
            const AppModes = Object.freeze({
                VIEW: Symbol('view'),
                EDIT: Symbol('edit'),
            });

            const SortingType = Object.freeze({
                LASTFIRSTNAME: `Last Name, First Name`,
                BIRTHDATE: `Birthdate`,
            });

            function App(divId) {
                //constants
                const assesser = new PersonalityAssesser();

                const Months = Object.freeze([
                    'January',
                    'February',
                    'March',
                    'April',
                    'May',
                    'June',
                    'July',
                    'August',
                    'September',
                    'October',
                    'November',
                    'December',
                ]);
                
                const fn = (i, n) => `${i}-${n}`;

                const mainDiv = document.getElementById(divId);
                const viewDiv = createElement('main');
                const dataStorageKey = `char_man_data_storage`;
                const saveInterval = 500;
                let saveTimer = null;
                let queueViewOnlyRedraw = false;
                let masterData = new AppData();
                let viewMode = AppModes.VIEW;

                this.loadFromFile = async (id) => {
                    const data = await loadJsonFiles(id);
                    if (data !== null && data.length === 1) {
                        setLoadedData(data[0]);
                        queueSave();
                    }
                    else {
                        loadFromLocalStorage();
                    }
                    start();
                };

                this.loadFromLocalStorage = () => {
                    const text = localStorage.getItem(dataStorageKey);
                    if (text !== null) {
                        setLoadedData(JSON.parse(text));
                    }
                    start();
                };

                function start() {
                    queueSave();
                    renderFull();
                }

                function renderFull() {
                    mainDiv.innerHTML = '';
                    renderCommonMenu();
                    mainDiv.appendChild(viewDiv);
                    renderViewOnly();
                }

                function renderViewOnly() {
                    if (viewDiv && viewDiv.innerHTML !== '' && saveTimer !== null) {
                        queueViewOnlyRedraw = true;
                        return;
                    }
                    viewDiv.innerHTML = '';
                    switch (viewMode) {
                        case AppModes.VIEW:
                            renderViewModeBody();
                            break;

                        case AppModes.EDIT:
                            renderEditModeBody();
                            break;
                    }
                }

                function renderViewModeBody() {
                    const top = createElement('section');
                    viewDiv.appendChild(top);
                    const controls = createElement('form');
                    controls.addEventListener('input', queueSaveAndRedraw);
                    top.appendChild(controls);

                    const yearDisplay = createElement('label', {'for': 'currentYear', 'id': 'yearDisplay'}, `Current Year: ${masterData.currentYear}`);
                    controls.appendChild(yearDisplay);
                    const minYear = Math.min(... masterData.characters.map(x => x.birthYear), masterData.currentYear);
                    const maxYear = Math.max(... masterData.characters.map(x => x.birthYear + x.maxAge), masterData.currentYear);
                    //TODO: can we get the slider to be wider? Or maybe we make it a numerical input instead of a slider?
                    const yearSlider = createElement('input', {'type': 'range', 'min': minYear, 'max': maxYear, 'value': masterData.currentYear, 'name': 'currentYear'});
                    yearSlider.addEventListener('input', () => yearDisplay.innerHTML = `Current Year: ${yearSlider.value}`);
                    controls.appendChild(yearSlider);

                    const checkboxLabel = createElement('label', {'for': 'showLivingOnly'});
                    const checkboxAttributes = {'type': 'checkbox', 'name': 'showLivingOnly', 'id': 'showLivingOnly'};
                    if (masterData.showLivingOnly) {
                        checkboxAttributes['checked'] = true;
                    }
                    checkboxLabel.appendChild(createElement('input', checkboxAttributes));
                    checkboxLabel.innerHTML += ` Only Show Living Individuals`;
                    controls.appendChild(checkboxLabel);

                    const section = createElement('section');
                    viewDiv.appendChild(section);
                    const header = createElement('header');
                    section.appendChild(header);
                    const title = createElement('h1', {}, `View Mode`);
                    header.appendChild(title);
                    masterData.characters.forEach(character => {
                        renderCharacterDisplayPanel(section, character)
                    });
                }

                function renderCharacterDisplayPanel(container, character) {
                        const age = masterData.currentYear - character.birthYear;
                        let ageDisplay = age.toString();
                        if (age < 0) {
                            ageDisplay = `unborn`;
                        }
                        else if (age > character.maxAge) {
                            ageDisplay = `deceased`;
                        }
                        if (!masterData.showLivingOnly || (age > -1 && age <= character.maxAge)) {
                            const aside = createElement('aside');
                            container.appendChild(aside);
                            const detail = makeDetail(`${character.firstName} ${character.lastName}: (${ageDisplay})`);
                            aside.appendChild(detail);
                            
                            const aliases = character.aliases && character.aliases.length > 0
                                ? character.aliases
                                : `none`;
                            detail.appendChild(createElement('p', {}, `<strong>Aliases:</strong> ${aliases}`));
                            detail.appendChild(createElement('p', {}, `<strong>Born:</strong> ${Months[character.birthMonth]} ${character.birthDay}, ${character.birthYear}`));
                            detail.appendChild(createElement('p', {}, `<strong>Max Age:</strong> ${character.maxAge}`));
                            if (character.role && character.role.length > 0) {
                                detail.appendChild(createElement('p', {}, `<strong>Role:</strong> ${character.role}`));
                            }
                            if (character.drivers && character.drivers.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Drivers:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.drivers));
                            }
                            if (character.injunctions && character.injunctions.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Injunctions:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.injunctions));
                            }
                            if (character.believedLie && character.believedLie.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Beleived Lie:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.believedLie));
                            }
                            if (character.thinksWants && character.thinksWants.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>What He/She Thinks He/She Wants:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.thinksWants));
                            }
                            if (character.reallyNeeds && character.reallyNeeds.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>What He/She Really Needs:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.reallyNeeds));
                            }
                            if (character.contradictions && character.contradictions.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Contradictions:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.contradictions));
                            }
                            if (character.description && character.description.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Description:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.description));
                            }
                            if (character.timeline && character.timeline.length > 0) {
                                detail.appendChild(createElement('p', {'style': `margin-bottom: .25em;`}, `<strong>Timeline:</strong>`));
                                detail.appendChild(createElement('pre', {'style': `white-space: pre-wrap; margin-top: .25em; padding: 0px;`}, character.timeline));
                            }
                            renderAssessments(character, detail);
                        }
                }

                function renderAssessments(character, container) {
                    const assessments = makeDetail(`${character.firstName}'s Personality Assessment`);
                    container.appendChild(assessments);

                    const western = makeFieldset('Western Zodiac');
                    western.appendChild(createElement('p', {}, assesser.assessWesternZodiac(character)));
                    assessments.appendChild(western);

                    const chinese = makeFieldset('Chinese Zodiac');
                    chinese.appendChild(createElement('p', {}, assesser.assessChineseZodiac(character)));
                    assessments.appendChild(chinese);

                    const celtic = makeFieldset('Celtic Tree Sign');
                    celtic.appendChild(createElement('p', {}, assesser.assessCelticTree(character)));
                    assessments.appendChild(celtic);

                    const numerology = makeFieldset('Numerology');
                    numerology.appendChild(createElement('p', {}, assesser.assessNumerology(character)));
                    assessments.appendChild(numerology);

                    const totem = makeFieldset('Native American Totem');
                    totem.appendChild(createElement('p', {}, assesser.assessNativeAmericanTotem(character)));
                    assessments.appendChild(totem);

                    const egyptian = makeFieldset('Egyptian Zodiac');
                    egyptian.appendChild(createElement('p', {}, assesser.assessEgyptianZodiac(character)));
                    assessments.appendChild(egyptian);

                    const mayan = makeFieldset('Mayan Zodiac');
                    mayan.appendChild(createElement('p', {}, assesser.assessMayanZodiac(character)));
                    assessments.appendChild(mayan);
                }

                function renderEditModeBody() {
                    const header = createElement('h1', {}, `Edit Mode`);
                    viewDiv.appendChild(header);
                    const characterListContainer = createElement('div');
                    viewDiv.appendChild(characterListContainer);
                    masterData.characters.forEach((element, i) => {
                        characterListContainer.appendChild(createElement('hr'));
                        renderCharacterEditPanel(characterListContainer, element, i);
                    });
                    const addCharacterButton = createElement('button', {}, `Add Character`);
                    addCharacterButton.addEventListener('click', () => {
                        characterListContainer.appendChild(createElement('hr'));
                        const newCharacter = new CharacterProfile();
                        masterData.characters.push(newCharacter);
                        renderCharacterEditPanel(characterListContainer, newCharacter, masterData.characters.length - 1);
                        queueSave();
                    });
                    viewDiv.appendChild(addCharacterButton);
                }

                function renderCharacterEditPanel(container, character, i) {
                    const section = createElement('section');
                    container.appendChild(section);

                    const form = createElement('form');
                    form.addEventListener('input', queueSave);
                    container.appendChild(form);

                    const header = createElement('header');
                    form.appendChild(header);
                    header.appendChild(createElement('h2', {}, `Character Worksheet`));

                    //Name
                    form.appendChild(createElement('label', {'for': fn(i, 'firstName')}, `First Name`));
                    form.appendChild(createElement('input', {'type': 'text', 'name': fn(i, 'firstName'), 'value': character.firstName}));
                    form.appendChild(createElement('label', {'for': fn(i, 'lastName')}, `Last Name`));
                    form.appendChild(createElement('input', {'type': 'text', 'name': fn(i, 'lastName'), 'value': character.lastName}));
                    form.appendChild(createElement('label', {'for': fn(i, 'aliases')}, `Other Aliases`));
                    form.appendChild(createElement('input', {'type': 'text', 'name': fn(i, 'aliases'), 'value': character.aliases}));

                    //Birth Year
                    form.appendChild(createElement('label', {'for': fn(i, 'birthYear')}, `Birth Year`));
                    form.appendChild(createElement('input', {'type': 'number', 'name': fn(i, 'birthYear'), 'value': character.birthYear}));

                    //Birth Month
                    form.appendChild(createElement('label', {'for': fn(i, 'birthMonth')}, `Birth Month`));
                    form.appendChild(makeSelect(fn(i, 'birthMonth'), Months, character.birthMonth));

                    //Birth Day
                    form.appendChild(createElement('label', {'for': fn(i, 'birthDay')}, `Birth Day`));
                    form.appendChild(makeNumberSelect(fn(i, 'birthDay'), 1, 31, character.birthDay));

                    //Max Age
                    form.appendChild(createElement('label', {'for': fn(i, 'maxAge')}, `Maximum Age (Alive Until)`));
                    form.appendChild(createElement('input', {'type': 'number', 'name': fn(i, 'maxAge'), 'value': character.maxAge}));

                    //Role
                    form.appendChild(createElement('label', {'for': fn(i, 'role')}, `Character Role`));
                    form.appendChild(createElement('input', {'type': 'text', 'name': fn(i, 'role'), 'value': character.role}));

                    //Drivers (DO axioms)
                    form.appendChild(createElement('label', {'for': fn(i, 'drivers')}, `Character Drivers`));
                    form.appendChild(createElement('textarea', {'rows': 5, 'name': fn(i, 'drivers'), 'placeholder': `The Character's DO Axioms`}, character.drivers));

                    //Injunctions (DO NOT axioms)
                    form.appendChild(createElement('label', {'for': fn(i, 'injunctions')}, `Character Injunctions`));
                    form.appendChild(createElement('textarea', {'rows': 5, 'name': fn(i, 'injunctions'), 'placeholder': `The Character's DO NOT Axioms`}, character.injunctions));

                    //Believed Lie
                    form.appendChild(createElement('label', {'for': fn(i, 'believedLie')}, `Believed Lie`));
                    form.appendChild(createElement('textarea', {'rows': 5, 'name': fn(i, 'believedLie'), 'placeholder': `The Lie the Character Believes`}, character.believedLie));

                    //Thinks Wants
                    form.appendChild(createElement('label', {'for': fn(i, 'thinksWants')}, `Thinks Wants`));
                    form.appendChild(createElement('textarea', {'rows': 5, 'name': fn(i, 'thinksWants'), 'placeholder': `What He/She Thinks He/She Wants`}, character.thinksWants));

                    //Really Needs
                    form.appendChild(createElement('label', {'for': fn(i, 'reallyNeeds')}, `Really Needs`));
                    form.appendChild(createElement('textarea', {'rows': 5, 'name': fn(i, 'reallyNeeds'), 'placeholder': `What He/She Really Needs`}, character.reallyNeeds));

                    //Contradictions
                    form.appendChild(createElement('label', {'for': fn(i, 'contradictions')}, `Character Contradictions and Hypocricies`));
                    form.appendChild(createElement('textarea', {'rows': 10, 'name': fn(i, 'contradictions'), 'placeholder': `The character's internal and external contradictions and hypocricies.`}, character.contradictions));

                    //Description
                    form.appendChild(createElement('label', {'for': fn(i, 'description')}, `Character Description and Details`));
                    form.appendChild(createElement('textarea', {'rows': 10, 'name': fn(i, 'description'), 'placeholder': `Write anything else not covered in the other fields...`}, character.description));

                    //Timeline
                    form.appendChild(createElement('label', {'for': fn(i, 'timeline')}, `Character Timeline`));
                    form.appendChild(createElement('textarea', {'rows': 10, 'name': fn(i, 'timeline'), 'placeholder': `Significant events in the character's life...`}, character.timeline));

                    //TODO: need to do more testing with this...
                    //It is DEFINITELY borked. Removing until I can fix it.
                    //Remove Button
                    //const removeButton = createElement('input', {'type': 'button', 'value': `Remove`});
                    //const myIndex = i;
                    //removeButton.addEventListener('click', () => {
                    //    masterData.characters.splice(myIndex, 1);
                    //    queueSaveAndRedraw();
                    //});
                    //form.appendChild(removeButton);
                }

                function queueSaveAndRedraw() {
                    queueViewOnlyRedraw = true;
                    queueSave();
                }

                function renderCommonMenu() {
                    const header = createElement('header');
                    const nav = createElement('nav');
                    header.appendChild(nav);
                    mainDiv.appendChild(header);

                    const appTitle = createElement('h1', {}, `Character Manager`);
                    nav.appendChild(appTitle);

                    const menu = createElement('ul');
                    nav.appendChild(menu);
                    
                    const sortMenuItem = createElement('li');
                    menu.appendChild(sortMenuItem);
                    sortMenuItem.appendChild(createElement('label', {'for': 'sortingType'}, `Sort By`));
                    const sortingSelect = makeSelect('sortingType', SortingType, masterData.sortingType);
                    sortingSelect.addEventListener('input', queueSaveAndRedraw);
                    sortMenuItem.appendChild(sortingSelect);

                    const viewMenuItem = createElement('li');
                    menu.appendChild(viewMenuItem);
                    const viewButton = createElement('button', {}, `VIEW`);
                    viewButton.addEventListener('click', () => changeMode(AppModes.VIEW));
                    viewMenuItem.appendChild(viewButton);

                    const editMenuItem = createElement('li');
                    menu.appendChild(editMenuItem);
                    const editButton = createElement('button', {}, `EDIT`);
                    editButton.addEventListener('click', () => changeMode(AppModes.EDIT));
                    editMenuItem.appendChild(editButton);

                    const saveMenuItem = createElement('li');
                    menu.appendChild(saveMenuItem);
                    const saveButton = createElement('input', {'type': 'button', 'value': 'Download Data'});
                    saveButton.addEventListener('click', () => triggerFileDownload());
                    saveMenuItem.appendChild(saveButton);
                }

                function changeMode(newMode) {
                    if (newMode !== viewMode) {
                        viewMode = newMode;
                        renderViewOnly();
                    }
                }

                function setLoadedData(rawData) {
                    Object.setPrototypeOf(rawData, AppData.prototype);
                    rawData.characters.forEach(c => Object.setPrototypeOf(c, CharacterProfile.prototype));
                    masterData = rawData;
                }

                function queueSave() {
                    if (saveTimer !== null) {
                        clearTimeout(saveTimer);
                    }
                    saveTimer = setTimeout(() => {
                        loadInMasterData();
                        localStorage.setItem(dataStorageKey, JSON.stringify(masterData));
                        //TODO: add some kind of indicator to the UI? An icon for pending save and an icon for 'data current'?
                        saveTimer = null;
                        console.log('Saved');
                        if (queueViewOnlyRedraw) {
                            queueViewOnlyRedraw = false;
                            renderViewOnly();
                        }
                    }, saveInterval);
                }

                function loadInMasterData() {
                    if (viewMode === AppModes.EDIT) {
                        masterData.characters.forEach((c, i) => {
                            c.firstName = document.getElementsByName(fn(i, 'firstName'))[0].value;
                            c.lastName = document.getElementsByName(fn(i, 'lastName'))[0].value;
                            c.aliases = document.getElementsByName(fn(i, 'aliases'))[0].value;

                            c.birthYear = parseInt(document.getElementsByName(fn(i, 'birthYear'))[0].value);

                            const monthSelect = document.getElementsByName(fn(i, 'birthMonth'))[0];
                            c.birthMonth = parseInt(monthSelect.options[monthSelect.selectedIndex].value);

                            const daySelect = document.getElementsByName(fn(i, 'birthDay'))[0];
                            c.birthDay = parseInt(daySelect.options[daySelect.selectedIndex].value);

                            c.maxAge = parseInt(document.getElementsByName(fn(i, 'maxAge'))[0].value);

                            c.role = document.getElementsByName(fn(i, 'role'))[0].value;

                            c.drivers = document.getElementsByName(fn(i, 'drivers'))[0].value;

                            c.injunctions = document.getElementsByName(fn(i, 'injunctions'))[0].value;

                            c.believedLie = document.getElementsByName(fn(i, 'believedLie'))[0].value;

                            c.thinksWants = document.getElementsByName(fn(i, 'thinksWants'))[0].value;

                            c.reallyNeeds = document.getElementsByName(fn(i, 'reallyNeeds'))[0].value;

                            c.contradictions = document.getElementsByName(fn(i, 'contradictions'))[0].value;

                            c.description = document.getElementsByName(fn(i, 'description'))[0].value;

                            c.timeline = document.getElementsByName(fn(i, 'timeline'))[0].value;
                        });
                    }
                    else if (viewMode === AppModes.VIEW) {
                        masterData.currentYear = parseInt(document.getElementsByName('currentYear')[0].value);
                        masterData.showLivingOnly = document.getElementsByName('showLivingOnly')[0].checked;
                    }
                    const sortSelect = document.getElementsByName('sortingType')[0];
                    masterData.sortingType = sortSelect.options[sortSelect.selectedIndex].value;

                    switch (SortingType[masterData.sortingType]) {
                        case SortingType.LASTFIRSTNAME:
                            masterData.characters = masterData.characters.sort(byLastAndFirstName);
                            break;
                        case SortingType.BIRTHDATE:
                            masterData.characters = masterData.characters.sort(byBirthday);
                            break;
                    }
                }

                function byLastAndFirstName(a, b) {
                    const aName = `${a.lastName.toUpperCase()} ${a.firstName.toUpperCase()}`;
                    const bName = `${b.lastName.toUpperCase()} ${b.firstName.toUpperCase()}`;
                    if (aName < bName) {
                        return -1;
                    }
                    if (aName > bName) {
                        return 1;
                    }
                    return 0;
                }

                function byBirthday(a, b) {
                    const aDate = new Date(`${a.birthYear}-${(a.birthMonth+1)}-${a.birthDay}`);
                    const bDate = new Date(`${b.birthYear}-${(b.birthMonth+1)}-${b.birthDay}`);
                    if (aDate < bDate) {
                        return -1;
                    }
                    if (aDate > bDate) {
                        return 1;
                    }
                    return 0;
                }

                function triggerFileDownload() {
                    const fakeLink = createElement('a', {'download': 'character_data.json', 'href': createDataSaveDownloadLinkUrl(JSON.stringify(masterData))});
                    const clickEvent = new MouseEvent('click');
                    fakeLink.dispatchEvent(clickEvent);
                }
            }

            function PersonalityAssesser() {
                // Helper to determine range
                function check(m, d, startM, startD, endM, endD) {
                    const val = m * 100 + d;
                    const start = startM * 100 + startD;
                    const end = endM * 100 + endD;
                    if (start > end) { // Wraps around year end
                        return val >= start || val <= end;
                    }
                    return val >= start && val <= end;
                };

                /**
                 * Assesses the character's Western Zodiac sign based on birth month and day.
                 * Returns a detailed narrative profile for use in character drafting.
                 */
                this.assessWesternZodiac = function(profile) {
                    const m = profile.birthMonth; // 0-indexed
                    const d = profile.birthDay;   // 1-indexed

                    if (check(m, d, 2, 21, 3, 19)) {
                        return `Aries (The Ram, The Catalyst): This character is a natural engine of action. They are likely ` +
                            `to be the one who initiates the plot, possessing a fiery personality and a ` +
                            `loyalty to the underdog. However, their tendency to jump in 'feet first' ` +
                            `without checking facts makes them prone to impulsive mistakes. To make them ` +
                            `feel authentic, give them a driver for leadership but a contradiction of ` +
                            `belligerence when their authority is questioned. Courageous, energetic, pioneering. Impulsive, stubborn, belligerent.`;
                    }
                    if (check(m, d, 3, 20, 4, 20)) {
                        return `Taurus (The Bull, The Anchor): A character defined by immense stamina and a practical, ` +
                            `methodical nature. They value simplicity and functionality. They are ` +
                            `excellent listeners but can be incredibly stubborn, often not knowing when ` +
                            `it is time to give ground or quit. Use this character as a stabilizing ` +
                            `force who might occasionally frustrate others with their self-indulgence. Reliable, diligent, patient. Self-indulgent, inflexible, slow to change.`;
                    }
                    if (check(m, d, 4, 21, 5, 20)) {
                        return `Gemini (The Twins, The Messenger): Characterized by a high degree of adaptability and a ` +
                            `clever, entertaining persona. They can blend into any social group, but ` +
                            `this 'mask' often hides an underlying need for deep emotional connection. ` +
                            `Their responses are unpredictable, and they may struggle with shallow ` +
                            `engagements or sudden mood swings that confuse their peers. Versatile, witty, imaginative. Inconsistent, shallow, anxious.`;
                    }
                    if (check(m, d, 5, 21, 6, 22)) {
                        return `Cancer (The Crab, The Protector): A traditionalist who appears composed on the surface ` +
                            `but hides a turmoil of shifting moods underneath. They are fiercely loyal ` +
                            `and protective of their home life. This character is easily hurt and ` +
                            `prone to periods of withdrawal. Their narrative role is often that of ` +
                            `the caregiver whose sensitivity is both their greatest strength and ` +
                            `their most significant vulnerability. Nurturing, loyal, sympathetic. Moody, overly sensitive, easily hurt.`;
                    }
                    if (check(m, d, 6, 23, 7, 22)) {
                        return `Leo (The Lion, The Sovereign): Exuberant and powerful, this character was born to lead. ` +
                            `They are brave and intuitive, but their bossiness often hides a ` +
                            `sensitive soul and a need for validation. To make them believable, ` +
                            `show their charismatic leadership in public while revealing their ` +
                            `underlying insecurities in private moments. Charismatic, brave, generous. Arrogant, domineering, vain.`;
                    }
                    if (check(m, d, 7, 23, 8, 22)) {
                        return `Virgo (The Virgin, The Analyst): An analytical and sophisticated character who loathes ` +
                            `being let down. They are knowledge-seekers who listen more than they ` +
                            `speak. However, they can be short-tempered and self-serving if they ` +
                            `perceive a lack of order or competence in those around them. Use them ` +
                            `as the character who keeps the group on track with detail-oriented planning. Precise, hardworking, sophisticated. Critical, picky, prone to worry.`;
                    }
                    if (check(m, d, 8, 23, 9, 22)) {
                        return `Libra (The Scales, The Diplomat): Driven by a desire for balance and harmony, this ` +
                            `character is a 'dreamer' rather than a 'doer.' They surround themselves ` +
                            `with beauty and avoid conflict, but their indecisiveness can lead to ` +
                            `stagnation. They are compassionate and selfless, yet they often over-reach ` +
                            `themselves and run out of steam before a project is finished. Charming, equitable, idealistic. Indecisive, naive, easily overwhelmed.`;
                    }
                    if (check(m, d, 9, 23, 10, 21)) {
                        return `Scorpio (The Scorpion, The Strategist): A cool, confident strategist who achieves ` +
                            `anything they set their mind to. They are secretive and single-minded, ` +
